repos:
  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.17.1            # pin exact version
    hooks:
      - id: gersemi
        files: (^|/)(CMakeLists\.txt|[^/]+\.cmake)$
        exclude: ^third_party/

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7           # pin exact LLVM version
    hooks:
      - id: clang-format
        args: [--style=file, --fallback-style=none]
        types_or: [c++, c, cuda]
        exclude: ^(third_party|src/json)/

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: rustfmt          # reads rustfmt.toml at the repo root
        language: system
        types: [rust]
